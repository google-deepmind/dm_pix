name: pypi

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python
      uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5f4f3d2cb2b236 # v4.7.1
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine build
    - name: Check consistency between the package version and release tag
      run: |
        pip install .
        RELEASE_VER=${GITHUB_REF#refs/*/}
        PACKAGE_VER="v`python -c 'import dm_pix; print(dm_pix.__version__)'`"
        if [ $RELEASE_VER != $PACKAGE_VER ]
        then
          echo "package ver. ($PACKAGE_VER) != release ver. ($RELEASE_VER)"; exit 1
        fi
    - name: Build
      run: |
        python -m build
    - name: Authenticate to Google Cloud (OSS Exit Gate)
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
    - name: Clean up stale releases from staging repo
      run: |
        packages=$(gcloud artifacts packages list \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="dm-pix--pypi" \
            --format="value(name)" 2>/dev/null)
        echo "${packages}" | xargs -r -I {} sh -c '
            package_name=$(basename "{}")
            echo "Deleting package: $package_name..."
            gcloud artifacts packages delete "{}" \
                --project="oss-exit-gate-prod" \
                --location="us" \
                --repository="dm-pix--pypi" \
                --quiet
        '
    - name: Stage distributions to OSS Exit Gate and upload manifest
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        python -m pip install --upgrade twine
        python -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/dm-pix--pypi/" \
          -u oauth2accesstoken \
          -p "$(gcloud auth print-access-token)" \
          dist/*
        echo '{"publish_all": true}' > manifest.json
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/dm-pix/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"